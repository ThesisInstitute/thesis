name: Publish attested generation

on:
  workflow_dispatch:
    inputs:
      ticket_path:
        description: Committed records/tickets/... generation ticket path.
        required: true
        type: string
      bundle_sha:
        description: Full commit SHA of a two-file attested bundle transport ref.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docket-writers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      actions: write # dispatches the recorder after publishing
      id-token: write # Sigstore attestation of records pushes
      attestations: write
    steps:
      - uses: astral-sh/setup-uv@v5

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Provision custody replay runtime
        run: |
          uv sync --locked --extra custody
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2

      - name: Fetch and unpack content-addressed bundle
        env:
          BUNDLE_SHA: ${{ inputs.bundle_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BUNDLE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "refusing bundle transport: bundle_sha must be full lowercase 40-hex" >&2
            exit 1
          fi
          git fetch --no-tags origin "$BUNDLE_SHA"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git cat-file -t "$BUNDLE_SHA")" = commit
          test "$(git rev-parse "$BUNDLE_SHA^{commit}")" = "$BUNDLE_SHA"
          CONTAINING_REFS=$(git for-each-ref \
            --format='%(refname)' --contains "$BUNDLE_SHA" refs/remotes/origin/)
          if [ -z "$CONTAINING_REFS" ]; then
            echo "refusing bundle transport: commit is not contained by an origin branch" >&2
            exit 1
          fi

          TRANSPORT=/tmp/attested-transport
          mkdir -p "$TRANSPORT"
          export TRANSPORT
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          sha = os.environ["BUNDLE_SHA"]
          raw = subprocess.check_output(["git", "ls-tree", "-z", sha])
          entries = {}
          for encoded in raw.split(b"\0"):
              if not encoded:
                  continue
              metadata, name = encoded.split(b"\t", 1)
              mode, kind, object_id = metadata.decode("ascii").split()
              entries[name.decode("ascii")] = (mode, kind, object_id)
          expected = {"bundle.tar.zst", "bundle.sha256"}
          if set(entries) != expected:
              raise SystemExit(
                  "refusing bundle transport: commit root must contain exactly "
                  f"{sorted(expected)}; found {sorted(entries)}"
              )
          for name, (mode, kind, _) in entries.items():
              if (mode, kind) != ("100644", "blob"):
                  raise SystemExit(
                      "refusing bundle transport: "
                      f"{name} must be a non-executable regular blob"
                  )
          sizes = {
              name: int(
                  subprocess.check_output(
                      ["git", "cat-file", "-s", object_id], text=True
                  ).strip()
              )
              for name, (_, _, object_id) in entries.items()
          }
          if sizes["bundle.sha256"] > 256:
              raise SystemExit(
                  "refusing bundle transport: bundle.sha256 exceeds 256 bytes"
              )
          if sizes["bundle.tar.zst"] > 1024 * 1024 * 1024:
              raise SystemExit(
                  "refusing bundle transport: compressed archive exceeds 1 GiB"
              )
          transport = pathlib.Path(os.environ["TRANSPORT"])
          for name in sorted(expected):
              with (transport / name).open("xb") as output:
                  subprocess.run(
                      ["git", "show", f"{sha}:{name}"],
                      stdout=output,
                      check=True,
                  )
          PY

          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re

          transport = pathlib.Path(os.environ["TRANSPORT"])
          declaration = (transport / "bundle.sha256").read_text()
          match = re.fullmatch(
              r"([0-9a-f]{64})(?:  bundle\.tar\.zst)?\n?", declaration
          )
          if not match:
              raise SystemExit(
                  "refusing bundle transport: bundle.sha256 must contain one "
                  "lowercase digest for bundle.tar.zst"
              )
          digest = hashlib.sha256()
          with (transport / "bundle.tar.zst").open("rb") as stream:
              while chunk := stream.read(1024 * 1024):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != match.group(1):
              raise SystemExit("refusing bundle transport: bundle sha256 mismatch")
          PY

          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import tarfile

          transport = pathlib.Path(os.environ["TRANSPORT"])
          compressed = transport / "bundle.tar.zst"
          expanded = transport / "bundle.tar"
          max_expanded_bytes = 2 * 1024 * 1024 * 1024
          expanded_bytes = 0
          with expanded.open("xb") as output, (transport / "zstd.stderr").open("wb") as error:
              process = subprocess.Popen(
                  ["zstd", "-q", "-d", "--stdout", str(compressed)],
                  stdout=subprocess.PIPE,
                  stderr=error,
              )
              assert process.stdout is not None
              while chunk := process.stdout.read(1024 * 1024):
                  expanded_bytes += len(chunk)
                  if expanded_bytes > max_expanded_bytes:
                      process.kill()
                      process.wait()
                      raise SystemExit(
                          "refusing bundle transport: expanded archive exceeds 2 GiB"
                      )
                  output.write(chunk)
              if process.wait() != 0:
                  raise SystemExit("refusing bundle transport: zstd decompression failed")

          destination = pathlib.Path("/tmp/docket-publication")
          destination.mkdir(mode=0o700)
          seen = set()
          total_file_bytes = 0
          with tarfile.open(expanded, mode="r:") as archive:
              member_count = 0
              for member in archive:
                  member_count += 1
                  if member_count > 20_000:
                      raise SystemExit(
                          "refusing bundle transport: archive has too many members"
                      )
                  raw_name = member.name
                  if raw_name.startswith("/"):
                      raise SystemExit(
                          f"refusing bundle transport: absolute archive path {raw_name!r}"
                      )
                  relative = pathlib.PurePosixPath(raw_name)
                  if ".." in relative.parts:
                      raise SystemExit(
                          f"refusing bundle transport: parent traversal in {raw_name!r}"
                      )
                  parts = tuple(part for part in relative.parts if part not in ("", "."))
                  if not parts:
                      continue
                  normalized = pathlib.PurePosixPath(*parts)
                  if normalized in seen:
                      raise SystemExit(
                          f"refusing bundle transport: duplicate archive path {normalized}"
                      )
                  seen.add(normalized)
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(
                          "refusing bundle transport: links and special archive "
                          f"members are forbidden: {normalized}"
                      )
                  target = destination.joinpath(*normalized.parts)
                  target.resolve().relative_to(destination.resolve())
                  if member.isdir():
                      if target.exists() and not target.is_dir():
                          raise SystemExit(
                              "refusing bundle transport: archive directory collides "
                              f"with a file: {normalized}"
                          )
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  total_file_bytes += member.size
                  if total_file_bytes > max_expanded_bytes:
                      raise SystemExit(
                          "refusing bundle transport: archive file payload exceeds 2 GiB"
                      )
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(
                          f"refusing bundle transport: cannot read archive member {normalized}"
                      )
                  with source, target.open("xb") as output:
                      shutil.copyfileobj(source, output)
                  target.chmod(0o600)

          root_entries = {path.name for path in destination.iterdir()}
          if root_entries != {"bundle_manifest.json", "repo"}:
              raise SystemExit(
                  "refusing bundle transport: archive root must contain exactly "
                  "bundle_manifest.json and repo"
              )
          if not (destination / "bundle_manifest.json").is_file():
              raise SystemExit("refusing bundle transport: bundle manifest is not a file")
          if not (destination / "repo").is_dir():
              raise SystemExit("refusing bundle transport: bundle repo is not a directory")
          PY

      - name: Verify attested bundle
        env:
          TICKET_PATH: ${{ inputs.ticket_path }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/verify_attested_bundle.py \
            --ticket-path "$TICKET_PATH" \
            --bundle-dir /tmp/docket-publication \
            --repo-root . \
            --now-utc "$NOW"

      - name: Derive trusted ticket publication inputs
        id: ticket
        env:
          TICKET_PATH: ${{ inputs.ticket_path }}
        run: |
          set -euo pipefail
          export TICKET_PATH
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          from generation_tickets import load_ticket, ticket_batch_filename

          ticket_path = pathlib.Path(os.environ["TICKET_PATH"])
          ticket = load_ticket(ticket_path)
          bundle_manifest = json.loads(
              pathlib.Path("/tmp/docket-publication/bundle_manifest.json").read_text()
          )
          expected_name = ticket_batch_filename(ticket)
          candidates = []
          for entry in bundle_manifest.get("files", []):
              path = pathlib.PurePosixPath(str(entry.get("path", "")))
              if (
                  len(path.parts) == 5
                  and path.parts[:3] == ("records", "thesis-analyst", "batches")
                  and path.name == expected_name
              ):
                  candidates.append(path.as_posix())
          if len(candidates) != 1:
              raise SystemExit(
                  "refusing attested publication: expected exactly one ticket batch "
                  f"manifest named {expected_name}; found {candidates}"
              )
          trusted_dir = pathlib.Path("/tmp/trusted-registration")
          trusted_dir.mkdir(mode=0o700)
          (trusted_dir / "roll-targets.json").write_text(
              json.dumps({"targets": ticket["targets"]}, indent=2) + "\n"
          )
          outputs = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with outputs.open("a") as stream:
              print(f"ticket_id={ticket['ticketId']}", file=stream)
              print(f"batch={candidates[0]}", file=stream)
              print(
                  f"registration_set_hash={ticket['registrationSetHash']}",
                  file=stream,
              )
          PY

      - name: Verify ticket registrations at HEAD
        env:
          EXPECTED_SET_HASH: ${{ steps.ticket.outputs.registration_set_hash }}
        run: |
          set -euo pipefail
          python3 scripts/register_targets.py \
            --targets-file /tmp/trusted-registration/roll-targets.json \
            --bind-registration-commits \
            --head HEAD \
            --metadata-out /tmp/publish-registration-check.json
          ACTUAL_SET_HASH=$(python3 -c "import json;print(json.load(open('/tmp/publish-registration-check.json'))['registrationSetHash'])")
          test "$ACTUAL_SET_HASH" = "$EXPECTED_SET_HASH"

      - name: Validate then apply the data bundle
        env:
          BATCH_MANIFEST: ${{ steps.ticket.outputs.batch }}
        run: |
          VALIDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/docket_publication.py validate \
            --bundle-dir /tmp/docket-publication \
            --batch "$BATCH_MANIFEST" \
            --trusted-targets /tmp/trusted-registration/roll-targets.json \
            --publish-validated-at-utc "$VALIDATED_AT" \
            --allow-published-wave \
            --apply

      - name: Verify complete record chain and custody graph
        run: |
          set -euo pipefail
          uv run --locked --extra custody python scripts/verify_record_chain.py records
          while IFS= read -r -d '' root; do
            python3 scripts/verify_custody.py "$(dirname "$root")"
          done < <(find records/thesis-analyst -name custody_root.json -type f -print0 | sort -z)

      - name: Regenerate publication TypeScript with trusted code
        id: publish
        env:
          BATCH_MANIFEST: ${{ steps.ticket.outputs.batch }}
        run: |
          set -euo pipefail
          DAY=$(basename "$(dirname "$BATCH_MANIFEST")")
          WAVE_HASH=$(shasum -a 256 "$BATCH_MANIFEST" | awk '{print $1}')
          if python3 scripts/register_wave.py \
              --name "auto-$DAY-$WAVE_HASH" \
              --batch "$BATCH_MANIFEST" \
              --allow-missing; then
            echo "published=1" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" = "2" ]; then
              echo "published=0" >> "$GITHUB_OUTPUT"
            else
              exit "$code"
            fi
          fi

      - name: Test regenerated site
        if: steps.publish.outputs.published == '1'
        run: |
          cd site
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Commit records and trusted generated publication
        id: commit
        env:
          TICKET_ID: ${{ steps.ticket.outputs.ticket_id }}
        run: |
          set -euo pipefail
          git config user.name "thesis-publisher"
          git config user.email "recorder@thesisinstitute.org"
          git add records/thesis-analyst/ site/src/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "publication is already present at $(git rev-parse HEAD)"
            echo "committed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/docket_publication.py scan-staged
          git commit -m "Publish attested generation $TICKET_ID"
          echo "committed=1" >> "$GITHUB_OUTPUT"

      - name: Rebase, reverify, and push once
        id: final_push
        if: steps.commit.outputs.committed == '1'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET_PATH: ${{ inputs.ticket_path }}
          BATCH_MANIFEST: ${{ steps.ticket.outputs.batch }}
          EXPECTED_SET_HASH: ${{ steps.ticket.outputs.registration_set_hash }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail
          auth_helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          pushed=0
          for attempt in 1 2 3; do
            echo "publication push attempt $attempt"
            if [ -n "$(git status --porcelain)" ]; then
              echo "publication tree is dirty before rebase" >&2
              exit 1
            fi
            git pull --rebase origin main
            uv sync --locked --extra custody

            # The candidate now contains its own batch, so its ticket is
            # necessarily consumed. Reverify with newly fetched trusted code
            # in a detached origin/main worktree; never bypass consumption.
            TRUSTED_MAIN=$(mktemp -d)
            rmdir "$TRUSTED_MAIN"
            git worktree add --detach "$TRUSTED_MAIN" origin/main
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if ! python3 "$TRUSTED_MAIN/scripts/verify_attested_bundle.py" \
                --ticket-path "$TRUSTED_MAIN/$TICKET_PATH" \
                --bundle-dir /tmp/docket-publication \
                --repo-root "$TRUSTED_MAIN" \
                --now-utc "$NOW"; then
              git worktree remove --force "$TRUSTED_MAIN"
              exit 1
            fi
            git worktree remove --force "$TRUSTED_MAIN"

            python3 scripts/register_targets.py \
              --targets-file /tmp/trusted-registration/roll-targets.json \
              --bind-registration-commits \
              --head HEAD \
              --metadata-out /tmp/rebase-registration-check.json
            ACTUAL_SET_HASH=$(python3 -c "import json;print(json.load(open('/tmp/rebase-registration-check.json'))['registrationSetHash'])")
            test "$ACTUAL_SET_HASH" = "$EXPECTED_SET_HASH"

            DAY=$(basename "$(dirname "$BATCH_MANIFEST")")
            WAVE_HASH=$(shasum -a 256 "$BATCH_MANIFEST" | awk '{print $1}')
            WAVE_NAME="auto-$DAY-$WAVE_HASH"
            if python3 scripts/register_wave.py \
                --name "$WAVE_NAME" \
                --batch "$BATCH_MANIFEST" \
                --allow-missing; then
              :
            else
              code=$?
              if [ "$code" != "2" ]; then
                exit "$code"
              fi
            fi
            git diff --exit-code
            git diff --cached --exit-code
            VALIDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            python3 scripts/docket_publication.py validate \
              --bundle-dir /tmp/docket-publication \
              --batch "$BATCH_MANIFEST" \
              --trusted-targets /tmp/trusted-registration/roll-targets.json \
              --publish-validated-at-utc "$VALIDATED_AT" \
              --allow-published-wave
            uv run --locked --extra custody python scripts/verify_record_chain.py records
            while IFS= read -r -d '' root; do
              python3 scripts/verify_custody.py "$(dirname "$root")"
            done < <(find records/thesis-analyst -name custody_root.json -type f -print0 | sort -z)
            if [ "$PUBLISHED" = "1" ]; then
              (
                cd site
                bun install --frozen-lockfile
                bun run test
                bun run build
              )
            fi
            if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
              echo "nothing of ours survived the rebase; refusing a no-op push" >&2
              exit 1
            fi
            LOCAL=$(git rev-parse HEAD)
            python3 - "$TICKET_PATH" <<'PY'
          import datetime as dt
          import sys

          sys.path.insert(0, "scripts")
          from generation_tickets import earliest_resolution_boundary, load_ticket

          ticket = load_ticket(sys.argv[1])
          now = dt.datetime.now(dt.timezone.utc)
          expires = dt.datetime.strptime(
              ticket["expiresAtUtc"], "%Y-%m-%dT%H:%M:%SZ"
          ).replace(tzinfo=dt.timezone.utc)
          if now >= expires:
              raise SystemExit(
                  f"generation ticket {ticket['ticketId']} expired at "
                  f"{ticket['expiresAtUtc']}"
              )
          boundary_value = earliest_resolution_boundary(ticket["targets"])
          boundary = dt.datetime.strptime(
              boundary_value, "%Y-%m-%dT%H:%M:%SZ"
          ).replace(tzinfo=dt.timezone.utc)
          if now >= boundary:
              raise SystemExit(
                  "verification time is at or past the targets' resolution boundary"
              )
          PY
            if git -c credential.helper= -c credential.helper="$auth_helper" push origin main; then
              # A zero-exit push is the attestation boundary. Never put a
              # second network call between this success and attest_commit:
              # its own batch would consume the ticket on any retry.
              pushed=1
              break
            fi
            sleep 2
          done
          if [ "$pushed" != "1" ]; then
            echo "publication push did not converge after 3 attempts" >&2
            exit 1
          fi
          echo "attest_commit=$LOCAL" >> "$GITHUB_OUTPUT"

      - name: Attest the publication push
        if: steps.final_push.outputs.attest_commit != ''
        uses: ./.github/actions/attest-records-push
        with:
          commit: ${{ steps.final_push.outputs.attest_commit }}

      - name: Confirm the attested commit remains on main
        if: steps.final_push.outputs.attest_commit != ''
        env:
          PUSHED_COMMIT: ${{ steps.final_push.outputs.attest_commit }}
        run: |
          set -euo pipefail
          REMOTE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$REMOTE" = "$PUSHED_COMMIT" ]; then
            echo "confirmed main at attested commit $PUSHED_COMMIT"
            exit 0
          fi
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$PUSHED_COMMIT" origin/main; then
            echo "main advanced from attested commit $PUSHED_COMMIT to $REMOTE"
            exit 0
          fi
          echo "attested commit $PUSHED_COMMIT is no longer on main ($REMOTE)" >&2
          exit 1

      - name: Stamp the record
        if: steps.commit.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_DEPLOY_HOOK_URL: ${{ secrets.MANUAL_DEPLOY_HOOK_URL }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "$PUBLISHED" != "1" ]; then
            gh workflow run record-forecasts.yml --ref main
            exit 0
          fi
          GOT=""
          for i in $(seq 1 24); do
            GOT=$(curl -sf https://app.thesisinstitute.org/build.json \
              | python3 -c 'import json,sys;print(json.load(sys.stdin).get("commit",""))' \
              2>/dev/null || true)
            [ "$GOT" = "$SHA" ] && break
            if [ "$i" = "12" ] && [ -n "$MANUAL_DEPLOY_HOOK_URL" ]; then
              curl -sf -X POST "$MANUAL_DEPLOY_HOOK_URL" > /dev/null || true
            fi
            sleep 30
          done
          if [ "$GOT" != "$SHA" ]; then
            echo "production never reached $SHA (canary shows: $GOT)" >&2
            exit 1
          fi
          gh workflow run record-forecasts.yml --ref main -f expected_sha="$SHA"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TICKET_PATH: ${{ inputs.ticket_path }}
          BUNDLE_SHA: ${{ inputs.bundle_sha }}
        run: |
          title="Attested generation publish failed $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -z "$existing" ]; then
            body_file=$(mktemp)
            printf '%s\n' \
              "The attested-generation publish failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." \
              "Ticket: $TICKET_PATH" \
              "Bundle commit: $BUNDLE_SHA" > "$body_file"
            gh issue create --title "$title" --body-file "$body_file"
          fi
