name: Resolve pending cells

# The grading loop: capture official first prints for pending cells
# (advance-vintage, adapter-based), append them to the fact ledger, and
# rebuild the site so scores land the same day. Runs before the daily
# recorder (14:17 UTC) so the snapshot captures fresh resolutions.

on:
  schedule:
    - cron: "40 13 * * *" # daily 13:40 UTC
  workflow_dispatch: {}

permissions:
  contents: write # resolution marker commit makes HEAD deployable
  issues: write
  id-token: write # Sigstore attestation of records pushes
  attestations: write

concurrency: resolve-pending

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install resolver parser dependencies
        # IRS SOI and EIA DNav use legacy BIFF .xls; witnessed SBA custody replays PDF
        # members; FSA CRP monthly summaries resolve through the poppler
        # pdftotext binary. Missing parsers are fatal rather than silent
        # deferrals — without poppler the 2027 CRP resolution would
        # refuse with "pdftotext is unavailable".
        run: |
          # receipt: the staged chronicle series-catalog generator (run during
          # witnessed append proposals) imports it via check_thesis_facts_append.
          # Exact-pinned like its neighbors and matching chronicle's own pin.
          pip install --user xlrd==2.0.1 pypdf==6.14.2 receipt==0.6.0
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pdftotext -v 2>&1 | head -1
          # SSA official pages resolve through a declared headless-browser
          # transport (scripts/official_browser_fetch.py): ssa.gov's Akamai
          # Bot Manager answers every non-browser TLS client with 403 while
          # serving Chromium normally (verified from this runner 2026-08-23).
          # A missing engine is fatal in the resolver, never a silent defer.
          pip install --user playwright==1.62.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/official_browser_fetch.py \
            https://www.ssa.gov/policy/docs/statcomps/ssi_monthly/index.html \
            --out /tmp/ssa-transport-smoke.html | head -c 600

      - name: Resolve pending cells against official prints
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.ARCH_DATA_TOKEN }}
          LEDGER_PRODUCER_SIGNING_KEY: ${{ secrets.LEDGER_PRODUCER_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Stream resolver output while capturing it: command substitution
          # swallowed stdout whenever the resolver failed, hiding which
          # cells resolved or deferred before the failure.
          python3 scripts/resolve_pending.py 2>&1 | tee /tmp/resolve-out.log
          if grep -q "^appended" /tmp/resolve-out.log; then
            echo "appended=1" >> "$GITHUB_OUTPUT"
          else
            echo "appended=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare ledger branch with the last successful deployment
        id: ledger
        env:
          GH_TOKEN: ${{ secrets.ARCH_DATA_TOKEN }}
          APPENDED: ${{ steps.resolve.outputs.appended }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api \
            repos/PolicyEngine/chronicle/commits/codex/thesis-ledger-facts \
            --jq .sha)
          if ! [[ "$CURRENT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ledger API returned a non-commit value: $CURRENT" >&2
            exit 1
          fi
          LAST=$(python3 - <<'PY'
          import json, pathlib
          marker = pathlib.Path("records/resolutions/latest.json")
          if marker.exists():
              try:
                  print(json.loads(marker.read_text()).get("ledgerBranchSha", ""))
              except (OSError, json.JSONDecodeError):
                  print("")
          PY
          )
          echo "current_sha=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "last_deployed_sha=$LAST" >> "$GITHUB_OUTPUT"
          if [ "$APPENDED" = "1" ] || [ "$CURRENT" != "$LAST" ]; then
            echo "needs_publish=1" >> "$GITHUB_OUTPUT"
          else
            echo "needs_publish=0" >> "$GITHUB_OUTPUT"
          fi
          echo "ledger current=$CURRENT last-successfully-deployed=${LAST:-none} appended=$APPENDED"

      - name: Advance the ledger pin and witness the new upstream state
        id: pin_witness
        if: steps.ledger.outputs.needs_publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The site build consumes the ledger at the committed pin, never
          # the branch name. The pin advances only here, and only after the
          # refresh verifies every intermediate commit extended the previous
          # state line-for-line (a rewrite or truncation refuses the pin).
          # The witness run archives the newly pinned observation and catalog
          # bytes into the record chain so the state the site scored against
          # stays reconstructable even if upstream history later changes.
          python3 scripts/pin_ledger.py --require-catalog
          PIN_SHA=$(python3 -c 'import json; print(json.load(open("site/src/data/ledger-pin.json"))["sha"])')
          PIN_LINES=$(python3 -c 'import json; print(json.load(open("site/src/data/ledger-pin.json"))["lineCount"])')
          PIN_JSONL_SHA256=$(python3 -c 'import json; print(json.load(open("site/src/data/ledger-pin.json"))["jsonlSha256"])')
          PIN_CATALOG_SHA256=$(python3 -c 'import json; print(json.load(open("site/src/data/ledger-pin.json"))["catalogSha256"])')
          PIN_CATALOG_BYTES=$(python3 -c 'import json; print(json.load(open("site/src/data/ledger-pin.json"))["catalogBytes"])')
          WITNESS_MANIFEST=$(python3 scripts/witness_upstream_ledger.py \
            --ledger-sha "$PIN_SHA" \
            --expect-line-count "$PIN_LINES" \
            --expect-jsonl-sha256 "$PIN_JSONL_SHA256" \
            --require-catalog \
            --expect-catalog-sha256 "$PIN_CATALOG_SHA256" \
            --expect-catalog-bytes "$PIN_CATALOG_BYTES")
          test -f "$WITNESS_MANIFEST"
          echo "witness_manifest=$WITNESS_MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Commit resolution rebuild request (makes HEAD deployable)
        if: steps.ledger.outputs.needs_publish == '1'
        env:
          WITNESS_MANIFEST: ${{ steps.pin_witness.outputs.witness_manifest }}
        run: |
          set -euo pipefail
          LEDGER_SHA=$(python3 -c 'import json; print(json.load(open("site/src/data/ledger-pin.json"))["sha"])')
          WITNESS_DIR=$(python3 scripts/verify_witnessed_pin.py \
            "$WITNESS_MANIFEST" site/src/data/ledger-pin.json)
          WITNESS_REL="$WITNESS_DIR/manifest.json"
          # Vercel honors [skip ci] even on deploy-hook builds, so a hook
          # fired while HEAD is a recorder commit silently cancels and
          # scores never surface (F13). A real, non-skip marker commit
          # both records the resolution event and guarantees a
          # deployable HEAD.
          mkdir -p records/resolutions
          # latest.json is updated only after the deploy canary succeeds.
          # Keeping the successful marker unchanged until then makes a rerun
          # retry publication after any partial marker/deploy failure (X6).
          printf '{"requestedAt":"%s","workflowRun":"%s","ledgerBranchSha":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_RUN_ID}" "$LEDGER_SHA" \
            > records/resolutions/rebuild-request.json
          git config user.name "thesis-resolver"
          git config user.email "recorder@thesisinstitute.org"
          git add -- records/resolutions/rebuild-request.json \
            site/src/data/ledger-pin.json \
            site/src/data/ledger-availability.generated.ts \
            records/ledger/availability.json \
            "$WITNESS_DIR"
          for resolution_dir in records/resolutions/????-??-??; do
            if [ -d "$resolution_dir" ]; then
              git add -- "$resolution_dir"
            fi
          done
          git ls-files --error-unmatch -- "$WITNESS_REL" >/dev/null
          while IFS= read -r -d '' witness_file; do
            git ls-files --error-unmatch -- "$witness_file" >/dev/null
          done < <(find "$WITNESS_DIR" -type f -print0)
          git ls-files --error-unmatch -- site/src/data/ledger-pin.json >/dev/null
          git commit -m "Resolution rebuild marker $(date -u +%F)"

      - name: Rebase resolution marker
        if: steps.ledger.outputs.needs_publish == '1'
        env:
          WITNESS_MANIFEST: ${{ steps.pin_witness.outputs.witness_manifest }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 scripts/verify_witnessed_pin.py \
            "$WITNESS_MANIFEST" site/src/data/ledger-pin.json

      - name: Push resolution marker
        id: marker_push
        if: steps.ledger.outputs.needs_publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "nothing of ours survived the rebase; refusing a no-op push" >&2
            exit 1
          fi
          auth_helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          git -c credential.helper= -c credential.helper="$auth_helper" push origin main
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Attest the resolution marker push
        if: steps.marker_push.outputs.pushed_sha != ''
        uses: ./.github/actions/attest-records-push
        with:
          commit: ${{ steps.marker_push.outputs.pushed_sha }}

      - name: Rebuild the site
        id: deploy
        if: steps.ledger.outputs.needs_publish == '1'
        run: |
          set -euo pipefail
          curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" > /dev/null
          SHA=$(git rev-parse HEAD)
          GOT=""
          for i in $(seq 1 24); do
            echo "deployment canary attempt $i"
            GOT=$(curl -sf https://app.thesisinstitute.org/build.json \
              | python3 -c 'import json,sys;print(json.load(sys.stdin).get("commit",""))' \
              2>/dev/null || true)
            [ "$GOT" = "$SHA" ] && break
            sleep 30
          done
          if [ "$GOT" != "$SHA" ]; then
            echo "production never reached $SHA (canary shows: $GOT)" >&2
            exit 1
          fi
          echo "scores live at $SHA"
          echo "site_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Record the successfully deployed ledger SHA
        id: deployed_ledger
        if: steps.ledger.outputs.needs_publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_SHA: ${{ steps.deploy.outputs.site_sha }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          LEDGER_SHA=$(git show "${SITE_SHA}:site/src/data/ledger-pin.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          printf '{"deployedAt":"%s","workflowRun":"%s","ledgerBranchSha":"%s","siteCommitSha":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_RUN_ID}" \
            "$LEDGER_SHA" "$SITE_SHA" > records/resolutions/latest.json
          git config user.name "thesis-resolver"
          git config user.email "recorder@thesisinstitute.org"
          git add records/resolutions/latest.json
          git commit -m "Record deployed resolution ledger $LEDGER_SHA [skip ci]"
          auth_helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          git -c credential.helper= -c credential.helper="$auth_helper" push origin main
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Attest the deployed-ledger push
        if: steps.deployed_ledger.outputs.pushed_sha != ''
        uses: ./.github/actions/attest-records-push
        with:
          commit: ${{ steps.deployed_ledger.outputs.pushed_sha }}

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Resolution loop failed $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" \
              --body "The resolve-pending loop failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Unresolved cells stay pending — fix before the next release day."
          fi
