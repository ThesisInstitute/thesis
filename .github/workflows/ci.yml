name: CI

on:
  push:
    branches: [main, brier-migration]
  pull_request:
    branches: [main, brier-migration]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NEXT_PUBLIC_SITE_ASSET_REV: ${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: site

      - name: Type check
        run: bunx tsc -b
        working-directory: site

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install captured-workbook replay parser
        run: python -m pip install xlrd==2.0.1

      - name: Test
        run: bun run test
        working-directory: site

      - name: Build
        run: bun run build
        working-directory: site

      - name: Enforce generated-site size budgets
        run: bun run check:size-budgets
        working-directory: site

  forecast-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: forecast-api

      - name: Test failure handling
        run: bun run test
        working-directory: forecast-api

      - name: Type check
        run: bun run typecheck
        working-directory: forecast-api

      - name: Build
        run: bun run build
        working-directory: forecast-api

  python-tests:
    runs-on: ubuntu-latest
    steps:
      # Full history: the chain verifier binds the genesis enumeration to its
      # source commit's Git tree, which a depth-1 checkout does not contain.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # The retry selector's published-catalog tests evaluate the site
      # catalog with bun; without it those tests skip silently.
      - uses: oven-sh/setup-bun@v2

      # The FSA CRP recovery fixtures replay through the real poppler
      # pdftotext binary — the same dependency the production resolver
      # runtime installs.
      - name: Install poppler-utils
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Install package with all extras
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -q

  # Give the bill extraction and paired-publication boundary fast feedback
  # while the complete Python suite continues to verify the entire archive.
  bill-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - uses: oven-sh/setup-bun@v2
      - name: Install package with all extras
        run: uv sync --all-extras
      - name: Check analyst runner lint
        run: |
          uv run ruff check scripts/run_thesis_analyst.py \
            scripts/evidence_secret_scan.py \
            scripts/tool_evidence.py scripts/tool_evidence_mcp.py \
            tests/test_tool_evidence_irs_soi.py \
            tests/test_evidence_secret_scan.py \
            scripts/thesis_records_to_comparisons.py \
            tests/test_thesis_analyst_runner.py \
            tests/test_thesis_analyst_env_hygiene.py
      - name: Verify bill extraction, mapping and paired publication
        run: |
          uv run pytest -q \
            tests/test_archive_strategy_attempt.py \
            tests/test_evidence_secret_scan.py \
            tests/test_bill_forecast_plan.py \
            tests/test_ingest_bill.py \
            tests/test_map_bill_metrics.py \
            tests/test_strategy_targets.py \
            tests/test_strategy_generation.py \
            tests/test_strategy_suite.py \
            tests/test_strategy_publication.py \
            tests/test_strategy_comparisons.py \
            tests/test_strategy_workflow.py \
            tests/test_tool_evidence.py \
            tests/test_tool_evidence_irs_soi.py \
            tests/test_irs_soi_pub1304_adapter.py \
            tests/test_tool_evidence_custody.py \
            tests/test_tool_evidence_runner.py \
            tests/test_thesis_analyst_runner.py \
            tests/test_thesis_analyst_env_hygiene.py

  wave-reproducibility:
    runs-on: ubuntu-latest
    steps:
      # Full history for the same genesis-enumeration Git binding as above.
      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify immutable record chain
        run: uv run --locked --extra custody python scripts/verify_record_chain.py records

      - name: Regenerate newest custody-era wave
        run: uv run --locked --extra custody python scripts/verify_wave_reproducibility.py

  # The red-main alarm lives in its own job so it covers EVERY job above
  # (the in-step variant sat mid-job in build-and-test: it missed failures
  # in python-tests/wave-reproducibility/forecast-api entirely, and even
  # build-and-test's own size-budget step, which ran after it). It is also
  # the only job with issues: write — the 2026-07-31 outage produced no
  # alarm because the default read-only github.token cannot create issues
  # ("Resource not accessible by integration").
  hook-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Records-guard pre-push hook regression suite
        run: bash scripts/test_pre_push_guard.sh

  alert-on-main-failure:
    runs-on: ubuntu-latest
    needs:
      [build-and-test, forecast-api, python-tests, wave-reproducibility,
       packaged-smoke, hook-guard, bill-pipeline]
    if: failure() && github.ref == 'refs/heads/main'
    permissions:
      issues: write
    steps:
      - name: Open the deduped red-main issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="CI failed on main $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'first(.[].number)' || true)
          if [ -z "$existing" ] || [ "$existing" = "null" ]; then
            gh issue create --title "$title" \
              --body "CI is red on main: https://github.com/${GH_REPO}/actions/runs/${{ github.run_id }}. Production deploys fail alongside — the site canary stays pinned to the last green build until this is fixed (2026-07-18 to 2026-07-20 outage class)."
          fi

  packaged-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Smoke test built artifact
        run: python scripts/smoke_packaged_install.py dist/*.whl
