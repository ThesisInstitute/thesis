name: Record forecasts

# Per-invocation immutable snapshot of every published forecast surface.  Each
# digest links the immediately preceding invocation and requests independently
# anchored RFC 3161 witnesses from every active public TSA.

on:
  schedule:
    - cron: "17 14 * * *" # daily 14:17 UTC
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact production commit expected by the publishing loop"
        required: false
        type: string
      publish_trust_key:
        description: "Ceremony: write records/trust/producer-ed25519.pem from the BRIER_PRODUCER_PUBLIC_KEY_PEM repository variable so it lands in this run's attested records push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  id-token: write # Sigstore attestation of records pushes
  attestations: write

concurrency: record-forecasts

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # Only workflows write records/**, so a TSA trust bundle approved in
      # verifier code reaches records/trust here and nowhere else. The script
      # copies a staged bundle only when its bytes equal the code pin. The
      # snapshot minted below names it in trustBundleUpdates and is witnessed
      # under the bundle that is already active, so the file, the snapshot and
      # the witness land in the same attested push. It is a no-op once every
      # approved bundle is published. See docs/tsa-trust-bundle-rotation.md.
      - name: Publish code-approved TSA trust bundles
        run: |
          uv run --locked --extra custody python scripts/publish_trust_bundles.py \
            --records records

      - name: Fetch and attest published forecast surfaces
        id: snapshot
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RECORDED_AT=$(date -u +%FT%TZ)
          SOURCE_DIR="/tmp/thesis-record-$RUN_ID"
          mkdir -p "$SOURCE_DIR/live"

          # The publish job dispatches this workflow seconds after pushing,
          # while Vercel is still building the new deployment. When an exact
          # SHA is expected, wait (bounded, ~10 min) for the deploy canary to
          # reach it rather than failing on the race; the exact-match check
          # below still fails closed if it never arrives.
          if [ -n "$EXPECTED_SHA" ]; then
            for _ in $(seq 1 40); do
              CANARY=$(curl -sf -m 30 https://app.thesisinstitute.org/build.json \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' \
                2>/dev/null || true)
              if [ "$CANARY" = "$EXPECTED_SHA" ]; then
                break
              fi
              sleep 15
            done
          fi

          # Resolve mutable aliases before any other surface fetch. Every
          # captured body below comes from these immutable Vercel deployment
          # URLs, and both aliases are checked again after collection (X7/X8).
          SITE_ALIAS_BUILD=$(mktemp)
          API_ALIAS_BUILD=$(mktemp)
          curl -sSf -m 90 https://app.thesisinstitute.org/build.json \
            -o "$SITE_ALIAS_BUILD"
          python3 -m json.tool "$SITE_ALIAS_BUILD" > /dev/null
          BUILD_SHA=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' \
            "$SITE_ALIAS_BUILD")
          SITE_DEPLOYMENT=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("deploymentUrl") or "")' \
            "$SITE_ALIAS_BUILD")
          if ! [[ "$BUILD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "build canary returned a non-commit value: $BUILD_SHA" >&2
            exit 1
          fi
          if ! [[ "$SITE_DEPLOYMENT" =~ ^[A-Za-z0-9-]+\.vercel\.app$ ]]; then
            echo "build canary did not return an immutable Vercel deployment URL" >&2
            exit 1
          fi

          curl -sSf -m 90 https://api.thesisinstitute.org/build.json \
            -o "$API_ALIAS_BUILD"
          python3 -m json.tool "$API_ALIAS_BUILD" > /dev/null
          API_DEPLOYMENT=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("deploymentUrl") or "")' \
            "$API_ALIAS_BUILD")
          if ! [[ "$API_DEPLOYMENT" =~ ^[A-Za-z0-9-]+\.vercel\.app$ ]]; then
            echo "API canary did not return an immutable Vercel deployment URL" >&2
            exit 1
          fi
          SITE_BASE="https://$SITE_DEPLOYMENT"
          API_BASE="https://$API_DEPLOYMENT"

          CHECKOUT_SHA=$(git rev-parse HEAD)
          git fetch --no-tags origin "$BUILD_SHA"
          if [ -n "$EXPECTED_SHA" ]; then
            if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "expected_sha is not a full commit SHA: $EXPECTED_SHA" >&2
              exit 1
            fi
            if [ "$BUILD_SHA" != "$EXPECTED_SHA" ]; then
              echo "refusing to record: deployed $BUILD_SHA != expected $EXPECTED_SHA" >&2
              exit 1
            fi
            ANCESTRY_DISTANCE=0
          else
            if ! git merge-base --is-ancestor "$BUILD_SHA" "$CHECKOUT_SHA"; then
              echo "refusing scheduled record: deployed $BUILD_SHA is not an ancestor-or-equal of checkout $CHECKOUT_SHA" >&2
              exit 1
            fi
            ANCESTRY_DISTANCE=$(git rev-list --count "$BUILD_SHA..$CHECKOUT_SHA")
          fi

          declare -A SURFACES=(
            [ledger]="ledger.json"
            [targets]="targets.json"
            [reward]="brier/reward.json"
            [build]="build.json"
          )
          for f in "${!SURFACES[@]}"; do
            curl -sSf -m 90 "$SITE_BASE/${SURFACES[$f]}" \
              -o "$SOURCE_DIR/$f.json"
            python3 -m json.tool "$SOURCE_DIR/$f.json" > /dev/null
          done
          cmp "$SITE_ALIAS_BUILD" "$SOURCE_DIR/build.json"
          curl -sSf -m 90 "$API_BASE/build.json" -o "$SOURCE_DIR/api-build.json"
          python3 -m json.tool "$SOURCE_DIR/api-build.json" > /dev/null
          cmp "$API_ALIAS_BUILD" "$SOURCE_DIR/api-build.json"
          python3 scripts/thesis_log_client.py \
            --url "$SITE_BASE/log.json" \
            --output-dir "$SOURCE_DIR"

          curl -sSf -m 90 \
            "https://api.github.com/repos/PolicyEngine/chronicle/commits/codex/thesis-ledger-facts" \
            -o "$SOURCE_DIR/ledger-commit.json"
          python3 -m json.tool "$SOURCE_DIR/ledger-commit.json" > /dev/null
          LEDGER_SHA=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' \
            "$SOURCE_DIR/ledger-commit.json")
          if ! [[ "$LEDGER_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ledger API returned a non-commit value: $LEDGER_SHA" >&2
            exit 1
          fi

          # Capture each live cell's streamed forecast event (full distribution).
          for slug in spm-child-poverty-2025 cpi-u-annual-2026 ctc-expansion-cost-ty2026 ctc-current-law-outlays-ty2026; do
            curl -sS -m 90 -N "$API_BASE/forecasts/$slug/stream" \
              | awk '/^event: forecast$/{f=1;next} f&&/^data: /{print substr($0,7); exit}' \
              > "$SOURCE_DIR/live/$slug.json" || true
            [ -s "$SOURCE_DIR/live/$slug.json" ] || \
              echo '{"error":"no forecast event captured"}' > "$SOURCE_DIR/live/$slug.json"
            python3 -m json.tool "$SOURCE_DIR/live/$slug.json" > /dev/null
          done

          SITE_ALIAS_AFTER=$(mktemp)
          API_ALIAS_AFTER=$(mktemp)
          curl -sSf -m 90 https://app.thesisinstitute.org/build.json \
            -o "$SITE_ALIAS_AFTER"
          curl -sSf -m 90 https://api.thesisinstitute.org/build.json \
            -o "$API_ALIAS_AFTER"
          if ! cmp "$SITE_ALIAS_BUILD" "$SITE_ALIAS_AFTER"; then
            echo "site alias changed deployments during snapshot collection" >&2
            exit 1
          fi
          if ! cmp "$API_ALIAS_BUILD" "$API_ALIAS_AFTER"; then
            echo "API alias changed deployments during snapshot collection" >&2
            exit 1
          fi

          snapshot_args=(uv run --locked --extra custody python scripts/record_forecast_snapshot.py \
            --records records \
            --challenge-inbox challenge/inbox \
            --target-registrations records/targets \
            --source-dir "$SOURCE_DIR" \
            --run-id "$RUN_ID" \
            --recorded-at "$RECORDED_AT" \
            --repo-sha "$CHECKOUT_SHA" \
            --ledger-sha "$LEDGER_SHA" \
            --site-deployment-url "$SITE_BASE" \
            --api-deployment-url "$API_BASE" \
            --deployment-ancestry-distance "$ANCESTRY_DISTANCE")
          if [ -n "$EXPECTED_SHA" ]; then
            snapshot_args+=(--expected-sha "$EXPECTED_SHA")
          fi
          DIGEST=$("${snapshot_args[@]}")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Publish producer trust key (ceremony dispatch only)
        if: ${{ inputs.publish_trust_key }}
        env:
          KEY_PEM: ${{ vars.BRIER_PRODUCER_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_PEM:-}" ]; then
            echo "publish_trust_key is set but BRIER_PRODUCER_PUBLIC_KEY_PEM is empty" >&2
            exit 1
          fi
          case "$KEY_PEM" in
            "-----BEGIN PUBLIC KEY-----"*) ;;
            *) echo "BRIER_PRODUCER_PUBLIC_KEY_PEM is not a public-key PEM" >&2; exit 1 ;;
          esac
          mkdir -p records/trust
          printf '%s' "$KEY_PEM" > /tmp/producer-trust-key.pem
          if [ -f records/trust/producer-ed25519.pem ]; then
            if ! cmp -s /tmp/producer-trust-key.pem records/trust/producer-ed25519.pem; then
              echo "records/trust/producer-ed25519.pem exists with different content; refusing" >&2
              exit 1
            fi
            echo "trust key already published; nothing to do"
          else
            cp /tmp/producer-trust-key.pem records/trust/producer-ed25519.pem
            echo "staged records/trust/producer-ed25519.pem for the attested records push"
          fi

      - name: Sign record snapshot
        env:
          BRIER_PRODUCER_SIGNING_KEY: ${{ secrets.BRIER_PRODUCER_SIGNING_KEY }}
        run: |
          uv run --locked --extra custody python scripts/sign_record_snapshot.py \
            --records records \
            "${{ steps.snapshot.outputs.digest }}"

      - name: Obtain independent RFC 3161 witnesses
        run: |
          set -euo pipefail
          DIGEST="${{ steps.snapshot.outputs.digest }}"
          uv run --locked --extra custody python scripts/witness_snapshot.py \
            --records records \
            --digest "$DIGEST"

      - name: Verify record chain
        run: uv run --locked --extra custody python scripts/verify_record_chain.py records

      # The new snapshot's witness extends externally proven coverage, so the
      # committed timeline — and its site bundle, which gates the headline
      # chronology tier — must be regenerated in the same commit; otherwise
      # tests/test_record_integrity.py fails on every clone until someone
      # refreshes them by hand.
      - name: Refresh witnessed timeline
        run: uv run --locked --extra custody python scripts/witnessed_timeline.py

      - name: Commit snapshot
        id: snapshot_push
        run: |
          set -euo pipefail
          git config user.name "thesis-recorder"
          git config user.email "recorder@thesisinstitute.org"
          git add records/ site/src/data/witnessed-timeline.generated.ts
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            committed=0
          else
            # Saved forecast pages read these archives at build time, so this
            # commit must trigger the normal site deployment.
            git commit -m "Record forecast surfaces $(date -u +%F)"
            committed=1
          fi
          git push origin main
          {
            echo "committed=$committed"
            echo "pushed_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the snapshot push
        if: steps.snapshot_push.outputs.committed == '1'
        uses: ./.github/actions/attest-records-push
        with:
          commit: ${{ steps.snapshot_push.outputs.pushed_sha }}

      # One available anchor is enough to witness a snapshot, so a TSA that
      # stops verifying never fails this workflow. Keep one issue open while
      # any anchor is unavailable and close it when all of them witness again.
      # Best effort: the snapshot is already pushed and attested, so a failed
      # notice must not mark the recording as failed. It retries every run.
      - name: Report degraded witnessing
        if: steps.snapshot_push.outputs.committed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIGEST: ${{ steps.snapshot.outputs.digest }}
        run: |
          set -uo pipefail
          title="Record witness degraded"
          status=0
          report=$(python3 scripts/witness_health.py --digest "$DIGEST") || status=$?
          echo "$report"
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ "$status" -eq 3 ] && [ -z "$existing" ]; then
            gh issue create --title "$title" \
              --body "$report"$'\n\n'"Recorder run: $RUN_URL"
          elif [ "$status" -eq 0 ] && [ -n "$existing" ]; then
            gh issue close "$existing" --comment "$report Recorder run: $RUN_URL"
          fi

      # A silent failure is a missing recorder invocation. File an issue so a
      # broken scheduled run surfaces the same day.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Record forecasts failed $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" \
              --body "The forecast-surface recorder failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. No immutable snapshot was added for this invocation; fix it promptly."
          fi
