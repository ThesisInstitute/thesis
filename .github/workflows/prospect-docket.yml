name: Prospect new series

# The widening loop: unprivileged agents propose targets, trusted code commits
# immutable registrations before forecasting, and a separate privileged job
# publishes only a validated data bundle. New series remain on probation until
# adopt_proven_series.py observes a resolved and scored cell.

on:
  schedule:
    - cron: "0 15 * * 3" # Wednesdays 15:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: "How many codex-proposed series (on top of mined gaps)"
        default: "2"
      mine_max:
        description: "Cap on ledger-mined gap targets"
        default: "4"
      focus:
        description: "Optional focus areas (e.g. 'UK, health, housing')"
        default: ""
      codex_model:
        description: "Codex model for the analyst (empty = pipeline default)"
        default: ""

permissions:
  contents: read

concurrency:
  group: docket-writers
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    outputs:
      proposals_artifact: ${{ steps.proposals.outputs.proposals_artifact }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install codex CLI
        run: bun add -g @openai/codex@0.144.0

      - name: Authenticate codex
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Mine ledger gaps
        env:
          MINE_MAX: ${{ github.event.inputs.mine_max || 4 }}
        run: |
          set -euo pipefail
          python3 scripts/mine_ledger_gaps.py \
            --max-targets "$MINE_MAX" \
            --out /tmp/mined-proposals.json || true

      - name: Propose candidates
        env:
          CODEX_COUNT: ${{ github.event.inputs.count || 2 }}
          FOCUS: ${{ github.event.inputs.focus }}
        run: |
          set -euo pipefail
          if [ "$CODEX_COUNT" != "0" ]; then
            args=(
              python3 scripts/prospect_series.py
              --count "$CODEX_COUNT"
              --out /tmp/codex-proposals.json
            )
            if [ -n "$FOCUS" ]; then
              args+=(--focus "$FOCUS")
            fi
            "${args[@]}" || true
          fi

      - name: Filter and combine proposals
        id: proposals
        run: |
          set -euo pipefail
          python3 scripts/prospect_targets.py filter \
            --input /tmp/mined-proposals.json \
            --input /tmp/codex-proposals.json \
            --out /tmp/prospect-proposals.json
          echo "proposals_artifact=prospect-docket-proposals-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload untrusted proposals
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.proposals.outputs.proposals_artifact }}
          path: /tmp/prospect-proposals.json
          if-no-files-found: error
          retention-days: 7

  register:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # Sigstore attestation of records pushes
      attestations: write
    outputs:
      count: ${{ steps.targets.outputs.count }}
      batch: ${{ steps.targets.outputs.batch }}
      source_sha: ${{ steps.sync.outputs.source_sha || steps.targets.outputs.base_sha }}
      registration_commit: ${{ steps.sync.outputs.registration_commits }}
      target_content_hash: ${{ steps.sync.outputs.target_content_hashes }}
      registration_set_hash: ${{ steps.sync.outputs.registration_set_hash }}
      registration_artifact: ${{ steps.targets.outputs.registration_artifact }}
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download untrusted proposals
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.propose.outputs.proposals_artifact }}
          path: /tmp/untrusted-proposals

      - name: Revalidate proposals with trusted code
        id: targets
        run: |
          set -euo pipefail
          INVENTORY=$(find /tmp/untrusted-proposals -mindepth 1 -maxdepth 1 -printf '%f\n')
          test "$INVENTORY" = "prospect-proposals.json"
          test -f /tmp/untrusted-proposals/prospect-proposals.json
          test ! -L /tmp/untrusted-proposals/prospect-proposals.json
          python3 scripts/prospect_targets.py validate \
            --input /tmp/untrusted-proposals/prospect-proposals.json \
            --targets-out /tmp/validated-prospect-targets.json
          mkdir -p /tmp/registered-targets
          install -m 0644 \
            /tmp/validated-prospect-targets.json \
            /tmp/registered-targets/prospect-targets.json
          COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/validated-prospect-targets.json'))['targets']))")
          DAY=$(date -u +%F)
          {
            echo "count=$COUNT"
            echo "batch=records/thesis-analyst/batches/$DAY/prospect-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json"
            echo "base_sha=$(git rev-parse HEAD)"
            echo "registration_artifact=prospect-docket-registration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Create immutable target registrations
        if: steps.targets.outputs.count != '0'
        run: |
          set -euo pipefail
          REGISTERED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/register_targets.py \
            --targets-file /tmp/registered-targets/prospect-targets.json \
            --date "${REGISTERED_AT%%T*}" \
            --registered-at-utc "$REGISTERED_AT" \
            --metadata-out /tmp/registration-before-commit.json

      - name: Commit trusted preregistration
        if: steps.targets.outputs.count != '0'
        id: registration_commit
        run: |
          set -euo pipefail
          git config user.name "thesis-prospector"
          git config user.email "recorder@thesisinstitute.org"
          git add records/targets/ site/src/data/ledger-targets.generated.ts
          if git diff --cached --quiet; then
            echo "committed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/docket_publication.py scan-staged
          git commit -m "Preregister prospect targets $(date -u +%F)"
          echo "committed=1" >> "$GITHUB_OUTPUT"

      - name: Synchronize, push, and bind registration commits
        if: steps.targets.outputs.count != '0'
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          pushed=0
          for attempt in 1 2 3; do
            echo "registration push attempt $attempt"
            if [ -n "$(git status --porcelain)" ]; then
              echo "registration tree is dirty before rebase" >&2
              exit 1
            fi
            git pull --rebase origin main
            python3 scripts/prospect_targets.py validate \
              --input /tmp/untrusted-proposals/prospect-proposals.json \
              --targets-out /tmp/replayed-prospect-targets.json
            cmp -s \
              /tmp/validated-prospect-targets.json \
              /tmp/replayed-prospect-targets.json
            uv run --locked --extra custody python scripts/verify_record_chain.py records
            while IFS= read -r -d '' root; do
              python3 scripts/verify_custody.py "$(dirname "$root")"
            done < <(find records/thesis-analyst -name custody_root.json -type f -print0 | sort -z)
            python3 scripts/register_targets.py \
              --targets-file /tmp/registered-targets/prospect-targets.json \
              --bind-registration-commits \
              --head HEAD \
              --metadata-out /tmp/registration-candidate.json
            LOCAL=$(git rev-parse HEAD)
            if git -c credential.helper= -c credential.helper="$auth_helper" push origin main; then
              REMOTE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
              if [ "$REMOTE" = "$LOCAL" ]; then
                install -m 0644 \
                  /tmp/registration-candidate.json /tmp/registration.json
                pushed=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$pushed" != "1" ]; then
            echo "registration push did not converge after 3 attempts" >&2
            exit 1
          fi
          SET_HASH=$(python3 -c "import json;print(json.load(open('/tmp/registration.json'))['registrationSetHash'])")
          COMMITS=$(python3 -c "import json;print(json.dumps(json.load(open('/tmp/registration.json'))['registrationCommits'],separators=(',',':')))")
          HASHES=$(python3 -c "import json;print(json.dumps(json.load(open('/tmp/registration.json'))['targetContentHashes'],separators=(',',':')))")
          {
            echo "source_sha=$LOCAL"
            echo "registration_set_hash=$SET_HASH"
            echo "registration_commits=$COMMITS"
            echo "target_content_hashes=$HASHES"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the registration push
        if: >-
          steps.registration_commit.outputs.committed == '1' &&
          steps.sync.outputs.source_sha != ''
        uses: ./.github/actions/attest-records-push
        with:
          commit: ${{ steps.sync.outputs.source_sha }}

      - name: Stage privileged target artifact
        if: steps.targets.outputs.count != '0'
        run: |
          set -euo pipefail
          install -m 0644 /tmp/registration.json /tmp/registered-targets/registration.json

      - name: Upload privileged target artifact
        if: steps.targets.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.targets.outputs.registration_artifact }}
          path: /tmp/registered-targets/
          if-no-files-found: error
          retention-days: 7

  generate:
    if: ${{ needs.register.result == 'success' && needs.register.outputs.count != '0' }}
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      publication_artifact: ${{ steps.bundle.outputs.publication_artifact }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.register.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download privileged target artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.register.outputs.registration_artifact }}
          path: /tmp/trusted-registration

      - name: Verify the registered source ref
        env:
          EXPECTED_SHA: ${{ needs.register.outputs.source_sha }}
          EXPECTED_SET_HASH: ${{ needs.register.outputs.registration_set_hash }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/register_targets.py \
            --targets-file /tmp/trusted-registration/prospect-targets.json \
            --bind-registration-commits \
            --head "$EXPECTED_SHA" \
            --metadata-out /tmp/generate-registration-check.json
          ACTUAL_SET_HASH=$(python3 -c "import json;print(json.load(open('/tmp/generate-registration-check.json'))['registrationSetHash'])")
          test "$ACTUAL_SET_HASH" = "$EXPECTED_SET_HASH"

      - uses: oven-sh/setup-bun@v2

      - name: Install codex CLI
        run: bun add -g @openai/codex@0.144.0

      - name: Authenticate codex
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Run the analyst batch
        env:
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
          THESIS_CODEX_MODEL: ${{ github.event.inputs.codex_model || '' }}
        run: |
          set -euo pipefail
          python3 scripts/run_thesis_batch.py \
            --targets-file /tmp/trusted-registration/prospect-targets.json \
            --timeout-seconds 540 \
            --out "$BATCH_MANIFEST" || true
          # Failed runs remain immutable records; partial success is allowed.

      - name: Stage data-only publication bundle
        id: bundle
        env:
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
        run: |
          python3 scripts/docket_publication.py stage \
            --bundle-dir /tmp/docket-publication \
            --batch "$BATCH_MANIFEST" \
            --trusted-targets /tmp/trusted-registration/prospect-targets.json
          echo "publication_artifact=prospect-docket-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload generated data bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.publication_artifact }}
          path: /tmp/docket-publication/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ always() }}
    needs: [register, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      actions: write
      id-token: write # Sigstore attestation of records pushes
      attestations: write
    steps:
      - name: Propagate upstream failure
        if: >-
          needs.register.result != 'success' ||
          (needs.register.outputs.count != '0' && needs.generate.result != 'success')
        run: |
          echo "The register or unprivileged generation job failed" >&2
          exit 1

      - uses: astral-sh/setup-uv@v5
      - uses: actions/checkout@v5
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'

      - name: Download untrusted data bundle
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.generate.outputs.publication_artifact }}
          path: /tmp/docket-publication

      - name: Download privileged target artifact
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.register.outputs.registration_artifact }}
          path: /tmp/trusted-registration

      - name: Verify privileged target artifact and registration ancestry
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        env:
          EXPECTED_SET_HASH: ${{ needs.register.outputs.registration_set_hash }}
        run: |
          set -euo pipefail
          python3 scripts/register_targets.py \
            --targets-file /tmp/trusted-registration/prospect-targets.json \
            --bind-registration-commits \
            --head HEAD \
            --metadata-out /tmp/publish-registration-check.json
          ACTUAL_SET_HASH=$(python3 -c "import json;print(json.load(open('/tmp/publish-registration-check.json'))['registrationSetHash'])")
          test "$ACTUAL_SET_HASH" = "$EXPECTED_SET_HASH"

      - name: Validate then apply the data bundle
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        env:
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
        run: |
          VALIDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/docket_publication.py validate \
            --bundle-dir /tmp/docket-publication \
            --batch "$BATCH_MANIFEST" \
            --trusted-targets /tmp/trusted-registration/prospect-targets.json \
            --publish-validated-at-utc "$VALIDATED_AT" \
            --allow-published-wave \
            --apply

      - name: Verify complete record chain and custody graph
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        run: |
          set -euo pipefail
          uv run --locked --extra custody python scripts/verify_record_chain.py records
          while IFS= read -r -d '' root; do
            python3 scripts/verify_custody.py "$(dirname "$root")"
          done < <(find records/thesis-analyst -name custody_root.json -type f -print0 | sort -z)

      - name: Regenerate publication TypeScript with trusted code
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success'
        id: publish
        env:
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
        run: |
          set -euo pipefail
          DAY=$(basename "$(dirname "$BATCH_MANIFEST")")
          WAVE_HASH=$(shasum -a 256 "$BATCH_MANIFEST" | awk '{print $1}')
          if python3 scripts/register_wave.py \
              --name "auto-$DAY-$WAVE_HASH" \
              --batch "$BATCH_MANIFEST" \
              --allow-missing; then
            echo "published=1" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" = "2" ]; then
              echo "published=0" >> "$GITHUB_OUTPUT"
            else
              exit "$code"
            fi
          fi

      - name: Test regenerated site
        id: site_test
        if: steps.publish.outputs.published == '1'
        # Does NOT gate any less strictly than before: the commit step below
        # still requires this to have passed. continue-on-error only buys the
        # chance to quarantine the batch before the job dies.
        continue-on-error: true
        run: |
          set -euo pipefail
          cd site
          # Retry the install. A transient 504 from api.github.com here on
          # 2026-07-22 discarded a completed analyst batch and left three
          # targets permanently unforecast.
          for install_attempt in 1 2 3; do
            if bun install --frozen-lockfile; then break; fi
            if [ "$install_attempt" = 3 ]; then
              echo "bun install failed after 3 attempts" >&2
              exit 1
            fi
            echo "bun install failed (attempt $install_attempt/3); retrying" >&2
            sleep $((install_attempt * 15))
          done
          bun run test
          bun run build

      - name: Quarantine the validated batch when the site gate fails
        if: steps.site_test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The bundle has already cleared provenance, custody and record-chain
          # verification by this point; only the site suite failed, and that
          # suite is global -- it goes red for reasons that have nothing to do
          # with this batch (a pre-existing unforecast orphan, an unrelated
          # test, a flaky install). Dropping the batch here is what turned one
          # transient failure into permanently unforecast targets, because the
          # registration is already on main and re-forecasting after the
          # release window would fabricate chronology. So preserve the work on
          # a branch. Nothing reaches main: the gate is unchanged.
          git config user.name "thesis-prospector"
          git config user.email "recorder@thesisinstitute.org"
          git add records/thesis-analyst/ site/src/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no publication content to quarantine"
            exit 0
          fi
          python3 scripts/docket_publication.py scan-staged
          git commit -m "Quarantined prospect publication $(date -u +%F) (run ${{ github.run_id }})"
          BRANCH="docket-quarantine/${{ github.run_id }}"
          auth_helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          git -c credential.helper= -c credential.helper="$auth_helper" \
            push origin "HEAD:refs/heads/$BRANCH"
          echo "Batch preserved on \`$BRANCH\`. Fix the site failure, then" \
            "re-publish from that branch before the registration leaves its" \
            "orphan grace window." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job after quarantining
        if: steps.site_test.outcome == 'failure'
        run: |
          echo "site gate failed; batch quarantined rather than published" >&2
          exit 1

      - name: Commit records and trusted generated publication
        # != 'failure' rather than == 'success': a failed-only batch skips the
        # gate entirely (published=0) and must still record its run.
        if: needs.register.result == 'success' && needs.register.outputs.count != '0' && needs.generate.result == 'success' && steps.site_test.outcome != 'failure'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "thesis-prospector"
          git config user.email "recorder@thesisinstitute.org"
          git add records/thesis-analyst/ site/src/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "publication is already present at $(git rev-parse HEAD)"
            echo "committed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/docket_publication.py scan-staged
          git commit -m "Prospect new docket series $(date -u +%F)"
          echo "committed=1" >> "$GITHUB_OUTPUT"

      - name: Rebase, reverify, and push once
        id: final_push
        if: steps.commit.outputs.committed == '1'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_MANIFEST: ${{ needs.register.outputs.batch }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail
          auth_helper="!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"
          pushed=0
          for attempt in 1 2 3; do
            echo "publication push attempt $attempt"
            if [ -n "$(git status --porcelain)" ]; then
              echo "publication tree is dirty before rebase" >&2
              exit 1
            fi
            git pull --rebase origin main
            DAY=$(basename "$(dirname "$BATCH_MANIFEST")")
            WAVE_HASH=$(shasum -a 256 "$BATCH_MANIFEST" | awk '{print $1}')
            WAVE_NAME="auto-$DAY-$WAVE_HASH"
            if python3 scripts/register_wave.py \
                --name "$WAVE_NAME" \
                --batch "$BATCH_MANIFEST" \
                --allow-missing; then
              :
            else
              code=$?
              if [ "$code" != "2" ]; then
                exit "$code"
              fi
            fi
            git diff --exit-code
            git diff --cached --exit-code
            VALIDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            python3 scripts/docket_publication.py validate \
              --bundle-dir /tmp/docket-publication \
              --batch "$BATCH_MANIFEST" \
              --trusted-targets /tmp/trusted-registration/prospect-targets.json \
              --publish-validated-at-utc "$VALIDATED_AT" \
              --allow-published-wave
            uv run --locked --extra custody python scripts/verify_record_chain.py records
            while IFS= read -r -d '' root; do
              python3 scripts/verify_custody.py "$(dirname "$root")"
            done < <(find records/thesis-analyst -name custody_root.json -type f -print0 | sort -z)
            if [ "$PUBLISHED" = "1" ]; then
              (
                cd site
                # install_attempt, not attempt: the enclosing publication push
                # loop owns $attempt, and only the subshell keeps this from
                # clobbering it.
                for install_attempt in 1 2 3; do
                  if bun install --frozen-lockfile; then break; fi
                  if [ "$install_attempt" = 3 ]; then
                    echo "bun install failed after 3 attempts" >&2
                    exit 1
                  fi
                  echo "bun install failed (attempt $install_attempt/3); retrying" >&2
                  sleep $((install_attempt * 15))
                done
                bun run test
                bun run build
              )
            fi
            if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
              echo "nothing of ours survived the rebase; refusing a no-op push" >&2
              exit 1
            fi
            LOCAL=$(git rev-parse HEAD)
            if git -c credential.helper= -c credential.helper="$auth_helper" push origin main; then
              REMOTE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
              if [ "$REMOTE" = "$LOCAL" ]; then
                pushed=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$pushed" != "1" ]; then
            echo "publication push did not converge after 3 attempts" >&2
            exit 1
          fi
          echo "attest_commit=$LOCAL" >> "$GITHUB_OUTPUT"

      - name: Attest the publication push
        if: steps.final_push.outputs.attest_commit != ''
        uses: ./.github/actions/attest-records-push
        with:
          commit: ${{ steps.final_push.outputs.attest_commit }}

      - name: Stamp the record
        if: steps.commit.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_DEPLOY_HOOK_URL: ${{ secrets.MANUAL_DEPLOY_HOOK_URL }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "$PUBLISHED" != "1" ]; then
            gh workflow run record-forecasts.yml --ref main
            exit 0
          fi
          GOT=""
          for i in $(seq 1 24); do
            GOT=$(curl -sf https://app.thesisinstitute.org/build.json \
              | python3 -c 'import json,sys;print(json.load(sys.stdin).get("commit",""))' \
              2>/dev/null || true)
            [ "$GOT" = "$SHA" ] && break
            if [ "$i" = "12" ] && [ -n "$MANUAL_DEPLOY_HOOK_URL" ]; then
              curl -sf -X POST "$MANUAL_DEPLOY_HOOK_URL" > /dev/null || true
            fi
            sleep 30
          done
          if [ "$GOT" != "$SHA" ]; then
            echo "production never reached $SHA (canary shows: $GOT)" >&2
            exit 1
          fi
          gh workflow run record-forecasts.yml --ref main -f expected_sha="$SHA"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REGISTER: ${{ needs.register.result }}
          GENERATE: ${{ needs.generate.result }}
          SITE_GATE: ${{ steps.site_test.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          PUSH: ${{ steps.final_push.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QUARANTINE: docket-quarantine/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A bare run link means the reader has to open the run, find the
          # failing job and read the log before knowing whether any work
          # survived. Say where it stopped and what it implies.
          title="Prospecting failed $(date -u +%F)"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          {
            echo "The prospect loop failed: $RUN_URL"
            echo
            echo '```'
            echo "register   ${REGISTER:-skipped}"
            echo "generate   ${GENERATE:-skipped}"
            echo "site gate  ${SITE_GATE:-skipped}"
            echo "commit     ${COMMIT:-skipped}"
            echo "push       ${PUSH:-skipped}"
            echo '```'
            echo
            if [ "${SITE_GATE:-}" = "failure" ]; then
              echo "**The analyst batch completed and is not lost.** It passed bundle"
              echo "validation, record-chain and custody verification; only the site"
              echo "suite failed, and that suite goes red for reasons unrelated to this"
              echo "batch. The work is preserved on \`$QUARANTINE\`."
              echo
              echo "Fix the site failure, then re-publish from that branch **before the"
              echo "registrations reach their release windows**, or they expire"
              echo "unforecast. This is exactly how the 2026-07-22 batch was lost: a"
              echo "504 from api.github.com during \`bun install\` discarded three"
              echo "finished forecasts whose registrations were already on main."
            elif [ "${PUSH:-}" = "failure" ]; then
              echo "Records were committed but the push did not converge. Check for a"
              echo "competing writer or a rejected push; the commit exists only in this"
              echo "run's workspace, so nothing reached main."
            elif [ -n "${GENERATE:-}" ] && [ "${GENERATE:-}" != "success" ]; then
              echo "The analyst leg failed, so no forecasts were produced. The"
              echo "registrations are already on main and are now awaiting a forecast;"
              echo "they stay forecastable until their release windows open."
            fi
          } > /tmp/alert-body.md
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file /tmp/alert-body.md
          else
            # Same title, different cause: comment rather than drop it, or the
            # second distinct failure of the day is invisible.
            gh issue comment "$existing" --body-file /tmp/alert-body.md
          fi
