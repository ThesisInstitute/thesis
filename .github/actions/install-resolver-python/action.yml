name: Install the resolver's Python runtime
description: >-
  Build a virtual environment on the runner's own python3 that holds exactly
  uv.lock's resolver and custody extras, every artifact downloaded fresh and
  checked against the lock's hashes, and put it first on PATH for the rest
  of the job. resolve-and-rebuild.yml runs the resolver in it; the CI job
  resolver-runtime runs this same install on every pull request, so a lock
  that interpreter cannot install fails there first.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
      with:
        # The uv that last ran this install green (resolver-runtime,
        # 2026-09-29). No cache: a restored cache could hand uv an
        # artifact it does not re-hash (review of #304, finding 4).
        version: "0.12.20"
        enable-cache: false

    - name: Install uv.lock's resolver and custody extras, hash-checked
      shell: bash
      run: |
        set -euo pipefail
        requirements="$RUNNER_TEMP/resolver-requirements.txt"
        venv="$RUNNER_TEMP/resolver-venv"
        # --locked refuses a uv.lock that disagrees with pyproject.toml.
        uv export --locked --no-dev --no-emit-project \
          --extra resolver --extra custody \
          --format requirements-txt \
          --output-file "$requirements" > /dev/null
        echo "exported $(grep -c '^[a-z]' "$requirements") pinned requirements"
        # The runner's own python3, and nothing else from the system: an
        # import the two extras do not declare fails loudly instead of
        # borrowing an unpinned system copy.
        uv venv --python "$(command -v python3)" "$venv"
        # --require-hashes refuses any artifact, and any dependency, that the
        # exported file does not name with a matching hash. --no-cache makes
        # uv download and hash every artifact here; --no-build refuses a
        # source build, whose build tools no hash covers. So receipt,
        # cryptography and the rest are the bytes uv.lock records.
        uv pip install --python "$venv/bin/python" --require-hashes \
          --no-cache --no-build --requirements "$requirements"
        "$venv/bin/python" -c 'import sys; print(sys.executable, sys.version)'
        echo "$venv/bin" >> "$GITHUB_PATH"
