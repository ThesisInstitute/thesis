[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brier"
version = "0.2.4"
description = "Forecasting as a harness for decision-making"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Max Ghenis"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["forecasting", "decision-making", "calibration", "prediction"]
dependencies = []

[project.scripts]
brier = "brier.cli:main"
brier-mcp = "brier.mcp_server:main"

[project.urls]
Homepage = "https://brier.institute"
Documentation = "https://brier.institute/docs"
Repository = "https://github.com/ThesisInstitute/thesis"
Issues = "https://github.com/ThesisInstitute/thesis/issues"

[project.optional-dependencies]
custody = [
    "receipt==0.6.1; python_version >= '3.11'",
    # SBA custody replays geometry through pypdf layout internals; any version
    # bump must pass the official-layout and adversarial-fixture suite first.
    "pypdf==6.14.2",
]
challenge = [
    # Submitter-side keyless signing for the challenge lane (#52). Exact-pinned
    # like receipt: any bump must pass the full suite at the new pin first.
    "sigstore==4.5.0; python_version >= '3.11'",
]
resolver = [
    # IRS SOI Publication 1304 and EIA DNav prints are legacy BIFF .xls
    # workbooks; xlrd 2.x is the .xls-only parser (no xlsx, no formulas),
    # exact-pinned like receipt/sigstore. resolve_pending.py imports it lazily
    # and fails closed with an install hint when absent.
    "xlrd==2.0.1",
    # SBA loan-performance resolution replays the hash-pinned PDF member from
    # witnessed custody and therefore needs the same strict parser as capture.
    "pypdf==6.14.2",
    # SSA official pages (SSI Monthly Statistics, Monthly Statistical
    # Snapshot, OHO workload XML) resolve through headless Chromium via
    # scripts/official_browser_fetch.py; ssa.gov's bot manager refuses every
    # non-browser client. Install the engine with
    # `python -m playwright install --with-deps chromium`.
    "playwright==1.62.0",
]
experiments = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "anthropic>=0.86.0",
    "openai>=2.29.0",
    "pandas>=2.3.3",
    "statsmodels>=0.14.6",
    "matplotlib>=3.10.8",
]
mcp = [
    "mcp[cli]>=1.26.0",
]
bills = [
    "httpx>=0.27",
    "pypdf>=5.1",
    "selectolax>=0.3.21",
]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "black>=26.3.1",
    "ruff>=0.15.7",
    "pyyaml>=6.0.2",
    # The IRS SOI and EIA DNav adapter fixtures parse real .xls workbooks.
    "xlrd==2.0.1",
]

[tool.setuptools.packages.find]
include = ["brier*"]

[tool.setuptools.package-data]
brier = [
    "assets/skills/codex/SKILL.md",
    "assets/skills/claude/SKILL.md",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
